<div id="login-card-3d" class="login-card">
  <div class="login-header">
    <h2>Bienvenido</h2>
    <p>Ingresa a tu cuenta para continuar</p>
  </div>

  <form class="login-form" (submit)="$event.preventDefault()">
    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" placeholder="Tu nombre de usuario" readonly>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" readonly>
    </div>

    <div class="form-options">
      <label class="remember-me">
        <input type="checkbox" disabled> Recordarme
      </label>
      <a href="#" (click)="$event.preventDefault()">¿Olvidaste tu contraseña?</a>
    </div>

    <button type="button" class="login-btn">Iniciar Sesión</button>

    <div class="login-footer">
      <p>¿No tienes una cuenta? <a href="#" (click)="$event.preventDefault()">Regístrate</a></p>
    </div>
  </form>
</div>
